
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b29">
<title>CITYVERSE 3D — MY CITY</title>

<style>
:root{
 --bg:#101722;--panel:#192536;--line:#304258;
 --text:#f3f7fc;--muted:#a0b1c5;--green:#46e5a6;
 --gold:#ffd166;--blue:#64c4ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:14px system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;
 padding:10px 13px;background:#121e2d;border-bottom:1px solid var(--line);gap:8px}
.brand{font-size:17px;font-weight:900;letter-spacing:-.5px}
.brand span{color:var(--green)}
.subtitle{font-size:9px;letter-spacing:1.5px;color:var(--muted)}
.head-actions{display:flex;gap:6px}
.btn{background:#24344a;border:1px solid #40536b;color:white;
 border-radius:10px;padding:9px 11px}
.btn.green{background:var(--green);color:#10251e;border-color:var(--green);font-weight:800}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 7px;min-width:0}
.metric label{font-size:9px;color:var(--muted);display:block;margin-bottom:5px}
.metric strong{font-size:clamp(13px,3.4vw,20px);display:block;overflow-wrap:anywhere}
.metric small{font-size:9px;color:var(--muted)}
.greenText{color:var(--green)}.goldText{color:var(--gold)}.blueText{color:var(--blue)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#9bc9d1}
#game{width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;top:10px;left:10px;right:10px;display:flex;
 justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.tag{padding:8px 10px;background:#111d2ce8;border:1px solid #ffffff20;
 border-radius:10px;font-size:10px;box-shadow:0 4px 14px #0002}
#status{color:var(--green)}
.bottomOverlay{position:absolute;bottom:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:7px;align-items:end;pointer-events:none}
.bottomOverlay .tag{max-width:70%}
.bottomOverlay button{pointer-events:auto}
#toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);
 background:#f1fff8;color:#14352a;border-radius:10px;padding:10px 13px;
 font-weight:800;font-size:12px;display:none;z-index:5;max-width:90%;text-align:center}
#bottom{background:#141f2e;border-top:1px solid var(--line);padding:8px 9px;
 padding-bottom:max(9px,env(safe-area-inset-bottom))}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.tool{min-width:0;padding:7px 2px;border-radius:10px;border:1px solid #304258;
 background:#202e42;color:white;min-height:60px}
.tool .ico{font-size:20px;display:block;margin-bottom:3px}
.tool .nm{font-size:10px;font-weight:750;display:block}
.tool .cost{font-size:9px;color:#a0b1c5;display:block;margin-top:3px}
.tool.selected{border-color:var(--green);background:#17443a;box-shadow:inset 0 0 0 1px #46e5a655}
.controls{display:flex;gap:6px;margin-top:7px;overflow-x:auto}
.controls button{white-space:nowrap;font-size:10px;padding:9px}
#side{position:absolute;right:10px;top:66px;display:flex;flex-direction:column;gap:6px}
#side button{background:#152335eF;border:1px solid #ffffff33;color:white;
 border-radius:11px;width:40px;height:40px;font-size:17px}
@media(min-width:850px){
 header{padding:13px 20px}
 .metrics{padding:10px 16px;gap:10px}
 .metric{padding:13px}
 #bottom{padding:12px 18px}
 .tools{grid-template-columns:repeat(10,minmax(0,1fr))}
 .tool{min-height:70px}
}
</style>
</head>

<body>
<div id="app">
<header>
 <div>
  <div class="brand">🏙 CITYVERSE <span>3D</span></div>
  <div class="subtitle">BUILD YOUR OWN MALAYSIA</div>
 </div>
 <div class="head-actions">
  <button class="btn" id="save">💾 Simpan</button>
  <button class="btn" id="pause">Ⅱ</button>
 </div>
</header>

<div class="metrics">
 <div class="metric"><label>💰 BAKI WANG</label><strong class="goldText" id="money">RM 250k</strong><small id="net">+RM 0/hari</small></div>
 <div class="metric"><label>👥 PENDUDUK</label><strong id="pop">0</strong><small id="capacity">Kapasiti 0</small></div>
 <div class="metric"><label>⚡ ELEKTRIK</label><strong class="greenText" id="power">0 / 0</strong><small>Guna / tersedia</small></div>
 <div class="metric"><label>💧 AIR</label><strong class="blueText" id="water">0 / 0</strong><small>Guna / tersedia</small></div>
</div>

<main id="stage">
 <canvas id="game"></canvas>
 <div id="toast"></div>
 <div class="overlay">
  <div class="tag">📍 <b id="city">BANDAR BARU</b><br><span id="date">HARI 1 · TAHUN 1</span></div>
  <div class="tag" id="status">● SIMULASI AKTIF</div>
 </div>
 <div id="side">
  <button id="zoomIn" aria-label="Zoom masuk">＋</button>
  <button id="zoomOut" aria-label="Zoom keluar">−</button>
  <button id="rotate" aria-label="Putar kamera">↻</button>
  <button id="home" aria-label="Tetapkan kamera">⌂</button>
 </div>
 <div class="bottomOverlay">
  <div class="tag" id="hint">Pilih binaan, kemudian sentuh tanah</div>
  <button class="btn" id="grid">▦ Grid</button>
 </div>
</main>

<footer id="bottom">
 <div class="tools" id="tools"></div>
 <div class="controls">
  <button class="btn" id="mode">🌴 Sandbox</button>
  <button class="btn" id="speed">▶ 1×</button>
  <button class="btn" id="tax">Cukai 8%</button>
  <button class="btn" id="bulldoze">🧹 Padam</button>
  <button class="btn" id="export">📄 Eksport</button>
  <button class="btn" id="reset">↺ Bandar Baru</button>
 </div>
</footer>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const $=id=>document.getElementById(id);
const SIZE=28, HALF=SIZE/2, KEY="cityverse3d_v1";
const defs={
 road:{name:"Jalan Raya",icon:"🛣️",cost:500,type:"road"},
 house:{name:"Rumah",icon:"🏠",cost:3000,pop:12,power:1,water:1,tax:90},
 shop:{name:"Kedai",icon:"🏪",cost:6500,jobs:8,power:2,water:1,tax:180},
 office:{name:"Pejabat",icon:"🏢",cost:12000,jobs:20,power:4,water:2,tax:350},
 factory:{name:"Kilang",icon:"🏭",cost:15000,jobs:25,power:7,water:4,tax:480,happy:-4},
 park:{name:"Taman",icon:"🌳",cost:4000,happy:8},
 power:{name:"Loji Elektrik",icon:"⚡",cost:25000,genPower:100,power:2,water:1},
 water:{name:"Loji Air",icon:"💧",cost:18000,genWater:100,power:2},
 school:{name:"Sekolah",icon:"🏫",cost:10000,power:3,water:2,happy:5},
 hospital:{name:"Hospital",icon:"🏥",cost:22000,power:6,water:4,happy:10},
 police:{name:"Balai Polis",icon:"🚓",cost:9000,power:2,water:1,happy:3},
 fire:{name:"Balai Bomba",icon:"🚒",cost:9000,power:2,water:1,happy:3}
};
let selected="road", paused=false, mode="sandbox", speed=1, tax=8;
let money=250000,day=1,year=1,population=0,happiness=75,challengeWon=false;
let gridVisible=true, cars=[], buildings=[], roads=new Map(), tiles=new Map();
let history=[];
const key=(x,z)=>`${x},${z}`;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bcbd4);
scene.fog=new THREE.Fog(0x9bcbd4,42,100);

const camera=new THREE.PerspectiveCamera(42,1,.1,300);
camera.position.set(25,28,31);
const renderer=new THREE.WebGLRenderer({canvas:$("game"),antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.minDistance=12;controls.maxDistance=64;
controls.maxPolarAngle=Math.PI*.46;
controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;
controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;

scene.add(new THREE.HemisphereLight(0xdff7ff,0x697657,2.1));
const sun=new THREE.DirectionalLight(0xfff0d7,3);
sun.position.set(-18,32,20);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-28;sun.shadow.camera.right=28;
sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;
sun.shadow.bias=-.001;
scene.add(sun);

const mat=(color,roughness=.88,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const M={
 grass:mat(0x9ab88b),grass2:mat(0xa4c291),earth:mat(0x71866a),
 road:mat(0x454b52,.95),sidewalk:mat(0xc4c1b1),
 line:mat(0xf5e7b7),white:mat(0xf7f4e9),
 trunk:mat(0x77543b),leaf:mat(0x52855a),leaf2:mat(0x71995a),
 glass:mat(0x8bc2d3,.32,.12),darkGlass:mat(0x315d73,.3,.15),
 roof:mat(0x555d60),redRoof:mat(0x9b5d49),
 concrete:mat(0xd9d0be),yellow:mat(0xe6b958),
 water:mat(0x4dabc5,.25,.2)
};
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x76b8c8));
ground.rotation.x=-Math.PI/2;ground.position.y=-.48;ground.receiveShadow=true;
scene.add(ground);

// Main buildable terrain
const island=new THREE.Mesh(new THREE.BoxGeometry(SIZE,.75,SIZE),
 [M.grass,M.grass,M.grass,M.earth,M.grass,M.grass]);
island.position.y=-.42;island.receiveShadow=true;island.castShadow=true;scene.add(island);

const groundTiles=new THREE.Group();scene.add(groundTiles);
for(let x=-HALF;x<HALF;x++)for(let z=-HALF;z<HALF;z++){
 const g=new THREE.PlaneGeometry(.985,.985);
 const m=new THREE.Mesh(g,((x+z)&1)?M.grass:M.grass2);
 m.rotation.x=-Math.PI/2;m.position.set(x+.5,-.035,z+.5);
 m.receiveShadow=true;groundTiles.add(m);
}

const world=new THREE.Group();scene.add(world);
const previewGroup=new THREE.Group();scene.add(previewGroup);
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let preview=null,hoverCell=null,dragged=false,pointerStart=null;
let carClock=0,lastFrame=performance.now(),simClock=0;

function box(parent,w,h,d,material,x,y,z,cast=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;
 parent.add(o);return o;
}
function cylinder(parent,r1,r2,h,material,x,y,z,segments=8){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}
function sphere(parent,r,material,x,y,z,segments=8){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,segments,6),material);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function flat(parent,w,d,material,x,y,z){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),material);
 o.rotation.x=-Math.PI/2;o.position.set(x,y,z);parent.add(o);return o;
}
function roadGroup(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);world.add(g);
 flat(g,.98,.98,M.road,0,.008,0);
 flat(g,.08,.65,M.line,0,.015,0);
 flat(g,.65,.08,M.line,0,.015,0);
 // Edge markings
 flat(g,.025,.92,M.white,-.43,.018,0);
 flat(g,.025,.92,M.white,.43,.018,0);
 flat(g,.92,.025,M.white,0,.018,-.43);
 flat(g,.92,.025,M.white,0,.018,.43);
 // Sidewalk corners
 for(const dx of [-.46,.46])for(const dz of [-.46,.46])
  flat(g,.07,.07,M.sidewalk,dx,.025,dz);
 return g;
}
function treeGroup(parent,x,z,scale=1,autumn=false){
 const g=new THREE.Group();g.position.set(x,0,z);parent.add(g);
 cylinder(g,.045*scale,.065*scale,.38*scale,M.trunk,0,.19*scale,0,6);
 const foliage=autumn?mat(0xd48a55):[M.leaf,M.leaf2,mat(0x42754e)][Math.floor(Math.random()*3)];
 sphere(g,.23*scale,foliage,0,.46*scale,0,7);
 sphere(g,.16*scale,foliage,-.12*scale,.55*scale,.02*scale,7);
 sphere(g,.15*scale,foliage,.11*scale,.56*scale,-.03*scale,7);
 return g;
}
function makeBuilding(type,x,z){
 const d=defs[type],g=new THREE.Group();g.position.set(x,0,z);world.add(g);
 const w=.65+Math.random()*.12,dep=.62+Math.random()*.12;
 if(type==="park"){
  flat(g,.92,.92,mat(0x8bb77d),0,.015,0);
  for(const [tx,tz,s] of [[-.22,-.2,.8],[.22,.17,.7],[-.15,.28,.65]])
   treeGroup(g,tx,tz,s);
  flat(g,.12,.72,M.sidewalk,0,.024,0);
  flat(g,.7,.12,M.sidewalk,0,.025,0);
  return g;
 }
 if(type==="house"){
  const wall=[mat(0xe5d6bd),mat(0xe8c8a9),mat(0xd3d8d1),mat(0xe5c2bc)][Math.floor(Math.random()*4)];
  const h=.62+Math.random()*.16;
  box(g,w,h,dep,wall,0,h/2+.025,0);
  const roofMat=[M.redRoof,mat(0x77736a),mat(0x4e6066)][Math.floor(Math.random()*3)];
  // Pitched roof using a triangular prism
  const shape=new THREE.Shape();
  shape.moveTo(-w*.58,0);shape.lineTo(0,.32);shape.lineTo(w*.58,0);shape.closePath();
  const roofGeo=new THREE.ExtrudeGeometry(shape,{depth:dep*1.08,bevelEnabled:false});
  const roof=new THREE.Mesh(roofGeo,roofMat);
  roof.rotation.y=Math.PI/2;roof.position.set(-dep*.54,h+.025,-w*.58);
  roof.castShadow=true;g.add(roof);
  box(g,.14,.22,.025,M.glass,-.18,.35,dep/2+.014,false);
  box(g,.14,.22,.025,M.glass,.18,.35,dep/2+.014,false);
  box(g,.13,.29,.035,mat(0x886b51),0,.17,dep/2+.02,false);
  box(g,.18,.035,.14,mat(0x62666a),.2,h+.1,-.1,false);
 }else{
  const isFactory=type==="factory",isOffice=type==="office";
  const floors=type==="shop"?2:type==="office"?5:type==="hospital"?4:
   type==="school"?2:type==="factory"?2:3;
  const h=floors*.48;
  const wall=type==="office"?mat(0xb4c5c9,.42,.12):
   type==="shop"?mat(0xe4d5bf):type==="factory"?mat(0xb8b8ae):
   type==="hospital"?mat(0xe6e8e4):type==="school"?mat(0xdac6a2):
   type==="police"?mat(0xcbd8e0):type==="fire"?mat(0xd9b2a6):
   type==="power"?mat(0xb5c1bd):mat(0xa7d4df);
  box(g,w,h,dep,wall,0,h/2+.02,0);
  // Flat rooftop and parapet
  box(g,w+.05,.07,dep+.05,M.roof,0,h+.045,0);
  box(g,w+.04,.09,.045,M.concrete,0,h+.07,dep/2);
  // Facade window grids
  for(let f=0;f<floors;f++){
   for(let j=0;j<3;j++){
    const wx=(j-1)*w*.29;
    const wy=.16+f*.46;
    box(g,.105,.19,.018,isFactory?M.roof:M.darkGlass,wx,wy,dep/2+.013,false);
    box(g,.105,.018,.022,M.white,wx,wy+.10,dep/2+.024,false);
   }
  }
  for(let f=0;f<floors;f++){
   for(let j=0;j<2;j++){
    box(g,.018,.19,.105,M.white,w/2+.012,.16+f*.46,(j-.5)*dep*.42,false);
   }
  }
  if(type==="shop"){
   box(g,w*.8,.12,.035,mat(0x418d8d),0,.28,dep/2+.03,false);
   box(g,.17,.25,.035,M.glass,0,.13,dep/2+.035,false);
  }
  if(type==="office"){
   for(let i=0;i<3;i++)box(g,.04,.28,.04,M.yellow,-.19+i*.19,h+.12,0,false);
  }
  if(type==="school"){
   box(g,.2,.07,.2,M.redRoof,0,h+.1,0);
   box(g,.13,.09,.035,M.yellow,0,h+.16,dep/2+.025,false);
  }
  if(type==="hospital"){
   box(g,.10,.35,.04,mat(0xd95459),0,h+.25,dep/2+.03,false);
   box(g,.32,.09,.04,mat(0xd95459),0,h+.25,dep/2+.035,false);
  }
  if(type==="factory"){
   cylinder(g,.08,.1,.65,M.roof,.2,h+.32,-.13,8);
   cylinder(g,.06,.08,.48,mat(0x9baba7),.2,h+.62,-.13,8);
  }
  if(type==="power"){
   box(g,.16,.35,.16,M.yellow,-.18,h+.2,0);
   box(g,.12,.24,.12,M.roof,.18,h+.15,0);
  }
  if(type==="water"){
   cylinder(g,.22,.22,.18,M.water,0,h+.15,0,12);
   cylinder(g,.18,.18,.45,M.water,0,h+.45,0,12);
   cylinder(g,.22,.22,.08,M.white,0,h+.7,0,12);
  }
  if(type==="police"||type==="fire"){
   box(g,.25,.1,.04,type==="fire"?mat(0xc04b3f):M.darkGlass,0,h+.12,dep/2+.035,false);
  }
 }
 // Surrounding paved lot
 flat(g,.96,.96,M.sidewalk,0,.002,0);
 // Rebuild building parts above lot by moving all non-lot pieces slightly up.
 // The lot is decorative; buildings remain anchored at ground level.
 return g;
}
function makeLot(type,x,z){
 const g=new THREE.Group();g.position.set(x,0,z);world.add(g);
 if(type==="park"){
  flat(g,.94,.94,mat(0x8cb780),0,.009,0);
  for(const [a,b,s] of [[-.24,-.2,.8],[.2,.15,.72],[-.15,.27,.62]])
   treeGroup(g,a,b,s);
  flat(g,.12,.78,M.sidewalk,0,.022,0);
  flat(g,.78,.12,M.sidewalk,0,.023,0);
  return g;
 }
 const building=makeBuilding(type,x,z);
 return building;
}
function connectedRoad(x,z){
 return [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>roads.has(key(x+a,z+b)));
}
function cellFromHit(point){
 return {x:Math.floor(point.x+HALF),z:Math.floor(point.z+HALF)};
}
function validCell(x,z){return x>=0&&z>=0&&x<SIZE&&z<SIZE}
function center(x,z){return {x:x-HALF+.5,z:z-HALF+.5}}
function toast(msg){
 const el=$("toast");el.textContent=msg;el.style.display="block";
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display="none",2300);
}
function addRoad(x,z){
 const k=key(x,z);
 if(roads.has(k)){toast("Jalan sudah dibina di sini.");return}
 if(money<defs.road.cost){toast("Wang tidak mencukupi.");return}
 money-=defs.road.cost;
 const p=center(x,z),g=roadGroup(p.x,p.z);
 roads.set(k,{x,z,group:g});tiles.set(k,"road");
 updateUI();save(false);
}
function build(type,x,z){
 if(!validCell(x,z))return;
 const k=key(x,z);
 if(type==="bulldoze"){
  if(roads.has(k)){
   world.remove(roads.get(k).group);roads.delete(k);tiles.delete(k);
   money+=125;toast("Jalan dipadam · RM125 dipulangkan");
  }else if(tiles.has(k)){
   const old=tiles.get(k),b=buildings.find(v=>v.key===k);
   if(b){world.remove(b.group);buildings=buildings.filter(v=>v!==b)}
   tiles.delete(k);money+=Math.floor((defs[old]?.cost||0)*.25);
   toast("Bangunan dipadam");
  }else{toast("Petak kosong.");return}
  updateUI();save(false);return;
 }
 if(!defs[type])return;
 if(tiles.has(k)){toast("Petak sudah digunakan.");return}
 if(type!=="road"&&!connectedRoad(x,z)){
  toast("Bangunan mesti bersebelahan jalan.");return;
 }
 if(money<defs[type].cost){toast("Wang tidak mencukupi!");return}
 money-=defs[type].cost;
 if(type==="road"){
  const p=center(x,z),g=roadGroup(p.x,p.z);
  roads.set(k,{x,z,group:g});tiles.set(k,"road");
 }else{
  const p=center(x,z),g=makeLot(type,p.x,p.z);
  buildings.push({key:k,type,x,z,group:g});
  tiles.set(k,type);
 }
 toast(defs[type].name+" dibina!");
 updateUI();save(false);
}
const rayPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function pick(e){
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hit=new THREE.Vector3();
 if(raycaster.ray.intersectPlane(rayPlane,hit))return cellFromHit(hit);
 return null;
}
function setSelected(type){
 selected=type;
 document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("selected",b.dataset.type===type));
 $("hint").textContent=type==="bulldoze"?"Sentuh jalan atau bangunan untuk memadam":`Bina ${defs[type].name} · ${type==="road"?"Pilih petak tanah":"Sentuh petak bersebelahan jalan"}`;
}
function buildTools(){
 const order=["road","house","shop","office","factory","park","power","water","school","hospital","police","fire"];
 $("tools").innerHTML=order.map(t=>`<button class="tool ${selected===t?"selected":""}" data-type="${t}">
 <span class="ico">${defs[t].icon}</span><span class="nm">${defs[t].name}</span>
 <span class="cost">RM ${defs[t].cost.toLocaleString("en-MY")}</span></button>`).join("");
 document.querySelectorAll("[data-type]").forEach(b=>b.addEventListener("click",()=>setSelected(b.dataset.type)));
}
const carsGroup=new THREE.Group();world.add(carsGroup);
function makeCar(color,x,z,angle=0){
 const g=new THREE.Group();carsGroup.add(g);
 const body=mat(color,.48);
 box(g,.24,.12,.43,body,0,.12,0);
 box(g,.19,.10,.21,M.glass,0,.22,-.02);
 for(const a of [-1,1])for(const b of [-1,1]){
  cylinder(g,.045,.045,.035,mat(0x20262a),a*.13,.055,b*.13,8).rotation.x=Math.PI/2;
 }
 g.position.set(x,.02,z);g.rotation.y=angle;
 return g;
}
function createCars(){
 for(const c of cars)carsGroup.remove(c.mesh);
 cars=[];
 const colors=[0xffffff,0x365b84,0xc74f3c,0xe0b84f,0x555b60,0x2e7b67];
 for(let i=0;i<7;i++){
  const lane=i%2?.17:-.17;
  const mesh=makeCar(colors[i%colors.length],-12+i*3,.5+lane,i%2?Math.PI:0);
  cars.push({mesh,lane,dir:i%2?-1:1,offset:i*4});
 }
}
function moveCars(dt){
 const roadRows=[];
 for(const r of roads.values())roadRows.push(r);
 if(roadRows.length<2)return;
 // Simple traffic loop along an east-west corridor when one exists.
 for(const c of cars){
  let z=.5+c.lane;
  const path=[...roads.values()].filter(r=>Math.abs((r.z-HALF+.5)-z)<.6);
  if(path.length<2){
   // Fall back to a visible demonstration route; vehicles stay on the island.
   z=.5+c.lane;
  }
  c.mesh.position.x+=dt*.85*c.dir*speed;
  if(c.mesh.position.x>HALF-1)c.mesh.position.x=-HALF+1;
  if(c.mesh.position.x< -HALF+1)c.mesh.position.x=HALF-1;
 }
}
function getTotals(){
 let genP=0,genW=0,useP=0,useW=0,cap=0,jobs=0,taxBase=0,parks=0;
 for(const b of buildings){
  if(!connectedRoad(b.x,b.z))continue;
  const d=defs[b.type];
  genP+=d.genPower||0;genW+=d.genWater||0;
  useP+=d.power||0;useW+=d.water||0;
  cap+=d.pop||0;jobs+=d.jobs||0;taxBase+=d.tax||0;
  if(b.type==="park")parks++;
 }
 const ps=useP?Math.min(1,genP/useP):1;
 const ws=useW?Math.min(1,genW/useW):1;
 const factor=Math.min(ps,ws);
 const pop=Math.floor(cap*factor);
 const income=Math.floor(pop*tax*1.8+taxBase*tax/8);
 const expenses=Math.floor(genP/100*320+genW/100*220+
  roads.size*3+buildings.filter(b=>["factory","office"].includes(b.type)).length*50);
 const happy=Math.max(5,Math.min(100,Math.round(75+parks*3-(1-factor)*25-Math.max(0,tax-8)*2)));
 return {genP,genW,useP,useW,cap,pop,income,expenses,ps,ws,happy,jobs};
}
function updateUI(){
 const t=getTotals();
 population=t.pop;happiness=t.happy;
 $("money").textContent="RM "+Math.round(money).toLocaleString("en-MY");
 $("net").textContent=(t.income-t.expenses>=0?"+":"−")+"RM "+Math.abs(t.income-t.expenses)+"/hari";
 $("pop").textContent=population.toLocaleString("en-MY");
 $("capacity").textContent="Kapasiti "+t.cap.toLocaleString("en-MY");
 $("power").textContent=t.useP+" / "+t.genP;
 $("water").textContent=t.useW+" / "+t.genW;
 $("date").textContent=`HARI ${day} · TAHUN ${year}`;
 $("city").textContent=mode==="challenge"?"BANDAR CABARAN":"BANDAR BARU";
 $("status").textContent=paused?"Ⅱ DIJEDA":"● SIMULASI AKTIF";
 $("status").style.color=paused?"#ffd166":"#46e5a6";
 $("pause").textContent=paused?"▶":"Ⅱ";
 $("mode").textContent=mode==="sandbox"?"🌴 Sandbox":"🏆 Cabaran";
 $("speed").textContent=`▶ ${speed}×`;
 $("tax").textContent=`Cukai ${tax}%`;
 if(mode==="challenge"&&!challengeWon&&population>=500&&buildings.some(b=>b.type==="hospital")){
  challengeWon=true;toast("🏆 CABARAN SELESAI! Bandar berjaya!");
 }
}
function save(show=true){
 try{
  const data={
   money,day,year,mode,speed,tax,challengeWon,
   roads:[...roads.values()].map(r=>[r.x,r.z]),
   buildings:buildings.map(b=>[b.type,b.x,b.z])
  };
  localStorage.setItem(KEY,JSON.stringify(data));
  if(show)toast("Bandar disimpan! 💾");
 }catch(e){if(show)toast("Simpanan gagal.")}
}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!d)return false;
  money=Number(d.money)||0;day=d.day||1;year=d.year||1;
  mode=d.mode==="challenge"?"challenge":"sandbox";
  speed=[1,2,4].includes(d.speed)?d.speed:1;
  tax=[5,8,10,12,15].includes(d.tax)?d.tax:8;
  challengeWon=!!d.challengeWon;
  for(const [x,z] of d.roads||[])if(validCell(x,z))addRoadLoaded(x,z);
  for(const [type,x,z] of d.buildings||[])if(defs[type]&&validCell(x,z))addBuildingLoaded(type,x,z);
  return true;
 }catch(e){return false}
}
function addRoadLoaded(x,z){
 const k=key(x,z);if(tiles.has(k))return;
 const p=center(x,z),g=roadGroup(p.x,p.z);
 roads.set(k,{x,z,group:g});tiles.set(k,"road");
}
function addBuildingLoaded(type,x,z){
 const k=key(x,z);if(tiles.has(k))return;
 const p=center(x,z),g=makeLot(type,p.x,p.z);
 buildings.push({key:k,type,x,z,group:g});tiles.set(k,type);
}
function reset(){
 if(!confirm("Mulakan bandar baharu? Kemajuan sekarang akan hilang."))return;
 for(const r of roads.values())world.remove(r.group);
 for(const b of buildings)world.remove(b.group);
 roads.clear();buildings=[];tiles.clear();
 money=250000;day=1;year=1;population=0;challengeWon=false;
 // A starting road segment
 for(let x=10;x<15;x++)addRoadLoaded(x,13);
 updateUI();save(false);toast("Bandar baru sedia!");
}
function resize(){
 const w=$("stage").clientWidth,h=$("stage").clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
renderer.domElement.addEventListener("pointerdown",e=>{
 pointerStart={x:e.clientX,y:e.clientY};
 dragged=false;
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>7)dragged=true;
});
renderer.domElement.addEventListener("pointerup",e=>{
 if(dragged)return;
 const c=pick(e);if(!c||!validCell(c.x,c.z))return;
 build(selected,c.x,c.z);
});
$("save").onclick=()=>save(true);
$("pause").onclick=()=>{paused=!paused;updateUI()};
$("zoomIn").onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.82).add(controls.target);controls.update()};
$("zoomOut").onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.2).add(controls.target);controls.update()};
$("rotate").onclick=()=>{const p=camera.position.clone().sub(controls.target);p.applyAxisAngle(new THREE.Vector3(0,1,0),Math.PI/4);camera.position.copy(controls.target.clone().add(p));controls.update()};
$("home").onclick=()=>{camera.position.set(25,28,31);controls.target.set(0,0,0);controls.update()};
$("grid").onclick=()=>{gridVisible=!gridVisible;groundTiles.visible=gridVisible};
$("bulldoze").onclick=()=>setSelected("bulldoze");
$("mode").onclick=()=>{
 mode=mode==="sandbox"?"challenge":"sandbox";
 if(mode==="challenge")toast("Sasaran: 500 penduduk dan bina hospital!");
 updateUI();save(false);
};
$("speed").onclick=()=>{speed=speed===1?2:speed===2?4:1;updateUI()};
$("tax").onclick=()=>{const rates=[5,8,10,12,15];tax=rates[(rates.indexOf(tax)+1)%rates.length];updateUI()};
$("reset").onclick=reset;
$("export").onclick=()=>{
 const blob=new Blob([localStorage.getItem(KEY)||"{}"],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="cityverse3d.json";a.click();URL.revokeObjectURL(a.href);
};
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save(false)});
window.addEventListener("pagehide",()=>save(false));

buildTools();
if(!load())for(let x=10;x<15;x++)addRoadLoaded(x,13);
createCars();resize();updateUI();

let lastSave=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;
 controls.update();
 if(!paused){
  simClock+=dt*speed;
  moveCars(dt);
  if(simClock>=9){
   simClock=0;day++;
   if(day>365){day=1;year++}
   const t=getTotals();money+=t.income-t.expenses;
   updateUI();
  }
 }
 if(now-lastSave>15000){save(false);lastSave=now}
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
